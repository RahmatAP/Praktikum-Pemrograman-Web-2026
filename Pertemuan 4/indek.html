<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portofolio - Pertemuan 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>Portofolio Proyek</h1>
            <p class="subtitle">Modul 4: Pengolahan Logika Data &amp; Interaktivitas DOM</p>
        </header>

        <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title">Tambah Proyek Baru</h2>
            <form id="project-form">
                <div class="form-grid">
                    <div class="form-field form-field-wide">
                        <label for="project-title">Judul Proyek</label>
                        <input type="text" id="project-title" name="title" placeholder="Masukkan judul proyek" required>
                    </div>
                    <div class="form-field">
                        <label for="project-category">Kategori</label>
                        <select id="project-category" name="category" required>
                            <option value="Web App">Web App</option>
                            <option value="Mobile App">Mobile App</option>
                            <option value="Desktop App">Desktop App</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="project-budget">Estimasi Anggaran (Rp)</label>
                        <input type="number" id="project-budget" name="budget" min="1" step="1" placeholder="Contoh: 2500000" required>
                    </div>
                    <div class="form-field form-field-wide checkbox-field">
                        <input type="checkbox" id="project-completed" name="completed">
                        <label for="project-completed">Sudah Selesai</label>
                    </div>
                </div>
                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
                <button class="btn btn-primary" type="submit">Tambah Proyek</button>
            </form>
        </section>

        <section class="stats-grid" aria-label="Statistik proyek">
            <div class="stat-card">
                <h3>Total Proyek</h3>
                <p id="stat-total-projects">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Anggaran</h3>
                <p id="stat-total-budget">Rp 0</p>
            </div>
            <div class="stat-card">
                <h3>Selesai Dikerjakan</h3>
                <p id="stat-completed-projects">0</p>
            </div>
        </section>

        <!-- Pencarian dan Filter Kategori -->
        <section class="project-section" aria-labelledby="project-list-title">
            <h2 id="project-list-title">Daftar Proyek</h2>
            <div class="search-field">
                <label for="project-search">Cari nama proyek</label>
                <input type="search" id="project-search" placeholder="Ketik nama proyek..." autocomplete="off">
            </div>
            <div class="filter-group" aria-label="Filter kategori">
                <button class="btn-filter active" type="button" data-category="Semua" aria-pressed="true">Semua Proyek</button>
                <button class="btn-filter" type="button" data-category="Web App" aria-pressed="false">Web App</button>
                <button class="btn-filter" type="button" data-category="Mobile App" aria-pressed="false">Mobile App</button>
                <button class="btn-filter" type="button" data-category="Desktop App" aria-pressed="false">Desktop App</button>
                <button class="btn-filter" type="button" data-category="UI/UX Design" aria-pressed="false">UI/UX Design</button>
            </div>
            <div id="project-list" class="project-list"></div>
        </section>
    </main>
</body>
</html>
